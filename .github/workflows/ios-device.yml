name: Build signed iOS device IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-device:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Apple signing certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${IOS_CERTIFICATE_BASE64}" || { echo 'Missing IOS_CERTIFICATE_BASE64'; exit 1; }
          test -n "${IOS_CERTIFICATE_PASSWORD}" || { echo 'Missing IOS_CERTIFICATE_PASSWORD'; exit 1; }
          test -n "${IOS_KEYCHAIN_PASSWORD}" || { echo 'Missing IOS_KEYCHAIN_PASSWORD'; exit 1; }
          KEYCHAIN_PATH="${RUNNER_TEMP}/build-signing.keychain-db"
          CERTIFICATE_PATH="${RUNNER_TEMP}/distribution.p12"
          printf '%s' "${IOS_CERTIFICATE_BASE64}" | base64 --decode > "${CERTIFICATE_PATH}"
          security create-keychain -p "${IOS_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${IOS_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" -P "${IOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security default-keychain -s "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${IOS_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${IOS_PROVISIONING_PROFILE_BASE64}" || { echo 'Missing IOS_PROVISIONING_PROFILE_BASE64'; exit 1; }
          PROFILE_PATH="${RUNNER_TEMP}/profile.mobileprovision"
          printf '%s' "${IOS_PROVISIONING_PROFILE_BASE64}" | base64 --decode > "${PROFILE_PATH}"
          PROFILE_PLIST="${RUNNER_TEMP}/profile.plist"
          security cms -D -i "${PROFILE_PATH}" > "${PROFILE_PLIST}"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "${PROFILE_PLIST}")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "${PROFILE_PLIST}")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "${PROFILE_PATH}" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
          {
            echo "IOS_PROFILE_UUID=${PROFILE_UUID}"
            echo "IOS_PROFILE_NAME=${PROFILE_NAME}"
          } >> "${GITHUB_ENV}"

      - name: Configure manual signing
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "${APPLE_TEAM_ID}" || { echo 'Missing APPLE_TEAM_ID'; exit 1; }
          python3 - <<'PY'
          import os
          import plistlib
          data = {
              'method': 'ad-hoc',
              'signingStyle': 'manual',
              'teamID': os.environ['APPLE_TEAM_ID'],
              'provisioningProfiles': {
                  'com.velzog.livraison.livraisonMobile': os.environ['IOS_PROFILE_NAME'],
              },
              'stripSwiftSymbols': True,
              'compileBitcode': False,
          }
          with open('ios/ExportOptions.plist', 'wb') as f:
              plistlib.dump(data, f)
          PY

      - name: Build signed IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload signed IPA
        uses: actions/upload-artifact@v7
        with:
          name: livraison_mobile-ios-device-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 14
