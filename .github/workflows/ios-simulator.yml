name: Build iOS simulator artifact
# Build on a hosted macOS runner for Windows developers.

on:
  workflow_dispatch:
  push:
    branches: [master, main]

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Simulator app
        run: flutter build ios --simulator --no-codesign

      - name: Run on iOS Simulator and capture evidence
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(device["udid"] for runtime in d["devices"].values() for device in runtime if device["isAvailable"] and device["name"].startswith("iPhone")))')"
          echo "Using simulator: ${DEVICE_ID}"
          xcrun simctl boot "${DEVICE_ID}" || true
          for attempt in $(seq 1 90); do
            if xcrun simctl list devices | grep -F "${DEVICE_ID}" | grep -q "Booted"; then
              break
            fi
            sleep 2
          done
          xcrun simctl list devices | grep -F "${DEVICE_ID}" | grep -q "Booted" || { echo "Simulator did not boot"; exit 1; }
          xcrun simctl install "${DEVICE_ID}" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "${DEVICE_ID}" com.velzog.livraison.livraisonMobile
          sleep 2
          xcrun simctl io "${DEVICE_ID}" screenshot ios-simulator-01-launch.png
          sleep 6
          xcrun simctl io "${DEVICE_ID}" screenshot ios-simulator-02-after-render.png
          xcrun simctl spawn "${DEVICE_ID}" log show --last 2m --style compact > ios-simulator.log || true
          xcrun simctl io "${DEVICE_ID}" screenshot ios-simulator-03-before-shutdown.png
          xcrun simctl shutdown "${DEVICE_ID}" || true

      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app livraison_mobile-ios-simulator.zip

      - name: Upload simulator artifacts
        uses: actions/upload-artifact@v4
        with:
          name: livraison_mobile-ios-simulator
          path: |
            livraison_mobile-ios-simulator.zip
            ios-simulator-01-launch.png
            ios-simulator-02-after-render.png
            ios-simulator-03-before-shutdown.png
            ios-simulator.log
          retention-days: 14
