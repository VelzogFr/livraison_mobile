name: Build iOS simulator artifact
# Build on a hosted macOS runner for Windows developers.

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build-ios-simulator:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Simulator app
        run: flutter build ios --simulator --no-codesign

      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app livraison_mobile-ios-simulator.zip

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: livraison_mobile-ios-simulator
          path: livraison_mobile-ios-simulator.zip
          retention-days: 14
