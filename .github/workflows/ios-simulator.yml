name: Build iOS simulator artifact
# Build on a hosted macOS runner for Windows developers.

on:
  workflow_dispatch:
  push:
    branches: [master, main]

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS Simulator app
        run: flutter build ios --simulator --no-codesign --dart-define=DEMO_MODE=true

      - name: Run on iOS Simulator and capture evidence
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(device["udid"] for runtime in d["devices"].values() for device in runtime if device["isAvailable"] and device["name"].startswith("iPhone")))')"
          echo "Using simulator: ${DEVICE_ID}"
          xcrun simctl boot "${DEVICE_ID}" || true
          for attempt in $(seq 1 90); do
            if xcrun simctl list devices | grep -F "${DEVICE_ID}" | grep -q "Booted"; then
              break
            fi
            sleep 2
          done
          xcrun simctl list devices | grep -F "${DEVICE_ID}" | grep -q "Booted" || { echo "Simulator did not boot"; exit 1; }
          xcrun simctl install "${DEVICE_ID}" build/ios/iphonesimulator/Runner.app
          echo "[demo] app installed"
          rm -f ios-simulator-demo.mp4 ios-simulator-*.png ios-simulator.log
          xcrun simctl io "${DEVICE_ID}" recordVideo --codec=h264 ios-simulator-demo.mp4 &
          VIDEO_PID=$!
          trap 'kill -TERM "${VIDEO_PID}" 2>/dev/null || true; wait "${VIDEO_PID}" 2>/dev/null || true; xcrun simctl shutdown "${DEVICE_ID}" || true' EXIT
          xcrun simctl launch "${DEVICE_ID}" com.velzog.livraison.livraisonMobile
          echo "[demo] app launched"
          sleep 1
          xcrun simctl io "${DEVICE_ID}" screenshot ios-simulator-01-launch.png
          echo "[demo] launch screenshot captured"
          sleep 6
          xcrun simctl io "${DEVICE_ID}" screenshot ios-simulator-02-delivery-photo.png
          echo "[demo] delivery/photo screenshot captured"
          sleep 5
          xcrun simctl io "${DEVICE_ID}" screenshot ios-simulator-03-profile.png
          echo "[demo] profile screenshot captured"
          sleep 8
          xcrun simctl io "${DEVICE_ID}" screenshot ios-simulator-04-history.png
          echo "[demo] history screenshot captured"
          xcrun simctl spawn "${DEVICE_ID}" log show --last 2m --style compact > ios-simulator.log || true
          xcrun simctl io "${DEVICE_ID}" screenshot ios-simulator-05-final.png
          echo "[demo] stopping video recorder ${VIDEO_PID}"
          kill -INT "${VIDEO_PID}" 2>/dev/null || true
          sleep 2
          kill -TERM "${VIDEO_PID}" 2>/dev/null || true
          sleep 2
          kill -KILL "${VIDEO_PID}" 2>/dev/null || true
          wait "${VIDEO_PID}" || true
          echo "[demo] video recorder stopped"
          xcrun simctl shutdown "${DEVICE_ID}" || true

      - name: Package simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app livraison_mobile-ios-simulator.zip

      - name: Delete previous video artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate \
            -H 'Accept: application/vnd.github+json' \
            /repos/${{ github.repository }}/actions/artifacts \
            --jq '.artifacts[] | select(.name == "livraison_mobile-ios-simulator") | .id' \
          | while read -r artifact_id; do
              [ -z "${artifact_id}" ] || gh api --method DELETE "/repos/${{ github.repository }}/actions/artifacts/${artifact_id}"
            done

      - name: Upload simulator artifacts
        uses: actions/upload-artifact@v7
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          name: livraison_mobile-ios-simulator
          path: |
            livraison_mobile-ios-simulator.zip
            ios-simulator-01-launch.png
            ios-simulator-02-delivery-photo.png
            ios-simulator-03-profile.png
            ios-simulator-04-history.png
            ios-simulator-05-final.png
            ios-simulator-demo.mp4
            ios-simulator.log
          retention-days: 14
